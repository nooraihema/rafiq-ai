<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رفيق AI | نظام تشخيص الأعطال</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 450px;
      height: 90vh;
      background: #fff;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.3);
    }
    .header {
      background: #1f2937;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }
    .status-dot {
      height: 10px;
      width: 10px;
      background-color: #bbb;
      border-radius: 50%;
      display: inline-block;
      margin-left: 5px;
    }
    .online { background-color: #4ade80; }
    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
    }
    .message {
      padding: 10px 15px;
      border-radius: 15px;
      margin: 8px 0;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.5;
    }
    .user {
      background: #3b82f6;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .bot {
      background: #e5e7eb;
      color: #000;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .error-msg {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fecaca;
      font-family: monospace;
      font-size: 12px;
    }
    .input-container {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 5px;
    }
    .input-container input {
      flex: 1;
      border: none;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }
    .input-container button {
      border: none;
      background: #3b82f6;
      color: #fff;
      padding: 0 25px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      رفيق AI - مستكشف الأخطاء
      <span id="engine-status" class="status-dot"></span>
      <small id="status-text">فحص الـ Hardware...</small>
    </div>
    <div id="chat-box" class="chat-box">
      <div class="message bot">👋 أهلاً إبراهيم! لو ظهر خطأ دلوقتي، هقولك سببه إيه بالظبط هنا.</div>
    </div>
    <div class="input-container">
      <input type="text" id="user-input" placeholder="اكتب رسالتك..." />
      <button id="send-btn">إرسال</button>
    </div>
  </div>

  <script type="module">
    import { AkashaRunner } from './src/core/akasharunner.js';

    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const statusDot = document.getElementById('engine-status');
    const statusText = document.getElementById('status-text');

    let runner = null;

    async function initEngine() {
      try {
        let device = null;
        if (navigator.gpu) {
          const adapter = await navigator.gpu.requestAdapter();
          if (adapter) {
            device = await adapter.requestDevice();
            statusDot.classList.add('online');
            statusText.innerText = "GPU Active";
          }
        }
        if (!device) statusText.innerText = "CPU Active";
        runner = new AkashaRunner(device);
      } catch (e) {
        addMessage(`🚨 فشل بدء المحرك: ${e.message}`, 'error-msg');
      }
    }

    function addMessage(text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.onclick = async () => {
      const text = userInput.value.trim();
      if (!text) return;
      if (!runner) {
        addMessage("⚠️ المحرك لم يكتمل تحميله بعد.", 'bot');
        return;
      }

      addMessage(text, 'user');
      userInput.value = '';
      
      try {
        // تجهيز بيانات المدخلات
        const inputData = new Float32Array(512).fill(text.length / 100);
        
        // محاولة التشغيل
        const result = await runner.runInference(inputData);
        
        addMessage(`✅ نجحت المعالجة!\nالنتيجة: ${result.data.slice(0,2)}`, 'bot');
      } catch (err) {
        // طباعة الخطأ التقني كاملاً للمساعدة في الحل
        addMessage(`🚨 خطأ تقني داخلي:\n${err.stack || err.message}`, 'error-msg');
        console.error("Full Trace:", err);
      }
    };

    initEngine();
  </script>
</body>
</html>
