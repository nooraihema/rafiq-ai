<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رفيق AI | محرك أكاشا</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: white; }
    .chat-container { width: 100%; max-width: 450px; height: 50vh; background: #fff; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; margin-top: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .header { background: #000; color: #fff; padding: 15px; text-align: center; font-size: 13px; border-bottom: 1px solid #333; }
    .status-dot { height: 8px; width: 8px; background-color: #555; border-radius: 50%; display: inline-block; margin-left: 5px; }
    .online { background-color: #00ff41; box-shadow: 0 0 5px #00ff41; }
    
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #f4f4f4; display: flex; flex-direction: column; }
    .message { padding: 10px 14px; border-radius: 12px; margin: 8px 0; font-size: 14px; max-width: 80%; line-height: 1.4; }
    .user { background: #0070f3; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot { background: #eaeaea; color: #000; align-self: flex-start; border-bottom-left-radius: 2px; font-weight: 500; }

    .logs-container { width: 100%; max-width: 450px; height: 40vh; background: #000; color: #00ff41; margin-top: 10px; border-radius: 8px; padding: 15px; font-family: 'Monaco', monospace; font-size: 11px; overflow-y: auto; border: 1px solid #333; }
    .log-step { margin-bottom: 5px; border-bottom: 1px solid #1a1a1a; padding-bottom: 2px; }
    .log-tag { color: #0070f3; font-weight: bold; }
    .log-val { color: #f1c40f; }
    .log-stat { color: #ff00ff; } /* لون خاص للإحصائيات */
    .log-error { color: #ff4d4d; }

    .input-container { display: flex; padding: 10px; background: white; border-top: 1px solid #eee; }
    input { flex: 1; border: none; padding: 8px; outline: none; font-size: 14px; color: #333; }
    button { background: #000; color: #fff; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      رفيق AI - محرك أكاشا <span id="engine-status" class="status-dot"></span>
    </div>
    <div id="chat-box" class="chat-box"></div>
    <div class="input-container">
      <input type="text" id="user-input" placeholder="اكتب رسالتك..." autofocus />
      <button id="send-btn">إرسال</button>
    </div>
  </div>
  <div class="logs-container" id="logs-view"></div>

  <script type="module">
    import { AkashaRunner } from './src/core/akasharunner.js';
    import { WebGPUBackend } from './src/core/webgpubackend.js';
    import { Tokenizer } from './src/core/tokenizer.js';
    import { AkashaGenerator } from './src/core/generator.js';

    const logsView = document.getElementById('logs-view');
    const statusDot = document.getElementById('engine-status');
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function printLog(tag, msg, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-step ${type === 'error' ? 'log-error' : ''}`;
      entry.innerHTML = `<span class="log-tag">[${tag}]</span> ${msg}`;
      logsView.appendChild(entry);
      logsView.scrollTop = logsView.scrollHeight;
    }

    // وظيفة لتحليل مصفوفة البيانات (Checking for Zeros)
    function analyzeTensor(data) {
        let sum = 0, max = -Infinity, nonZeros = 0;
        for(let v of data) {
            sum += Math.abs(v);
            if(v > max) max = v;
            if(v !== 0) nonZeros++;
        }
        const mean = sum / data.length;
        const health = ((nonZeros / data.length) * 100).toFixed(1);
        return `<span class="log-stat">Mean: ${mean.toFixed(6)} | Max: ${max.toFixed(4)} | Health: ${health}%</span>`;
    }

    let runner, generator;
    const tokenizer = new Tokenizer(5000);

    async function init() {
      printLog("CORE", "Starting Akasha Engine...");
      try {
        const adapter = await navigator.gpu?.requestAdapter();
        const device = await adapter?.requestDevice();
        if (!device) throw new Error("WebGPU not supported on this browser.");

        statusDot.classList.add('online');
        const backend = new WebGPUBackend(device);
        runner = new AkashaRunner(backend);
        generator = new AkashaGenerator(runner);

        // تحميل البيانات
        printLog("DATA", "Loading dataset.txt...");
        const res = await fetch('./dataset.txt');
        const text = await res.text();
        await generator.buildVocabFromText(text);
        printLog("VOCAB", `Dictionary size: ${generator.vocab.length}`);
        printLog("READY", "System is stable.");
      } catch (err) {
        printLog("FATAL", err.message, "error");
      }
    }

    sendBtn.onclick = async () => {
      const text = userInput.value.trim();
      if (!text || !generator) return;

      appendMessage('user', text);
      userInput.value = '';
      
      try {
        printLog("EXEC", `Processing: "${text}"`);
        const tokenIds = tokenizer.encode(text);
        
        const start = performance.now();
        const result = await generator.generate(tokenIds);
        const time = (performance.now() - start).toFixed(2);

        // تحليل النتائج (كشف الاصفار)
        if (result.raw) {
            printLog("SIGNAL", analyzeTensor(result.raw));
        }
        
        printLog("RESULT", `Predicted Word: <span class="log-val">"${result.word}"</span> (${time}ms)`);
        appendMessage('bot', result.word);
      } catch (err) {
        printLog("GPU_ERR", err.message, "error");
      }
    };

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });
    init();
  </script>
</body>
</html>
