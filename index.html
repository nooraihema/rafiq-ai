<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رفيق AI | محرك أكاشا</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .chat-container { width: 100%; max-width: 450px; height: 60vh; background: #fff; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; margin-top: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .header { background: #000; color: #fff; padding: 15px; text-align: center; font-size: 13px; border-bottom: 1px solid #333; }
    .status-dot { height: 8px; width: 8px; background-color: #555; border-radius: 50%; display: inline-block; margin-left: 5px; }
    .online { background-color: #00ff41; }
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #f4f4f4; }
    .message { padding: 10px 14px; border-radius: 12px; margin: 8px 0; font-size: 14px; max-width: 80%; }
    .user { background: #0070f3; color: #fff; align-self: flex-end; margin-left: auto; }
    .bot { background: #eaeaea; color: #000; align-self: flex-start; }
    .logs-container { width: 100%; max-width: 450px; height: 35vh; background: #000; color: #888; margin-top: 10px; border-radius: 8px; padding: 15px; font-family: 'Monaco', monospace; font-size: 11px; overflow-y: auto; border: 1px solid #333; }
    .log-step { margin-bottom: 6px; display: flex; }
    .log-step span:first-child { color: #0070f3; margin-right: 10px; font-weight: bold; }
    .log-error { color: #ff4d4d; }
    .input-container { display: flex; padding: 10px; background: white; border-top: 1px solid #eee; }
    input { flex: 1; border: none; padding: 8px; outline: none; }
    button { background: #000; color: #fff; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      رفيق AI - محرك أكاشا <span id="engine-status" class="status-dot"></span>
    </div>
    <div id="chat-box" class="chat-box"></div>
    <div class="input-container">
      <input type="text" id="user-input" placeholder="اكتب رسالتك..." />
      <button id="send-btn">إرسال</button>
    </div>
  </div>
  <div class="logs-container" id="logs-view"></div>

  <script type="module">
    const logsView = document.getElementById('logs-view');
    const statusDot = document.getElementById('engine-status');
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function printLog(msg, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-step ${type === 'error' ? 'log-error' : ''}`;
      entry.innerHTML = `<span>❯</span> ${msg}`;
      logsView.appendChild(entry);
      logsView.scrollTop = logsView.scrollHeight;
    }

    let runner = null;

    async function startLifecycle() {
      printLog("Loading Engine Modules...");
      try {
        const { AkashaRunner } = await import('./src/core/akasharunner.js');
        printLog("Modules Loaded Successfully.");
        
        // GPU Check
        const adapter = await navigator.gpu?.requestAdapter();
        const device = adapter ? await adapter.requestDevice() : null;
        
        if (device) {
            statusDot.classList.add('online');
            printLog("WebGPU Backend Active.");
        } else {
            printLog("CPU Fallback Active (No GPU).", "warn");
        }

        runner = new AkashaRunner(device);
        printLog("Akasha Engine Initialized.");
      } catch (err) {
        printLog(`Critical Error: ${err.message}`, "error");
      }
    }

    sendBtn.onclick = async () => {
      const text = userInput.value.trim();
      if (!text || !runner) return;

      const div = document.createElement('div'); div.className = 'message user'; div.innerText = text;
      chatBox.appendChild(div);
      userInput.value = '';
      
      printLog(`Inferencing: "${text}"`);
      const start = performance.now();
      
      try {
        const result = await runner.runInference(new Float32Array([text.length]));
        const duration = (performance.now() - start).toFixed(2);
        
        // عرض البيانات الحقيقية القادمة من الماتريكس
        const rawOutput = result.data.slice(0, 3).join(', ');
        printLog(`Execution completed in ${duration}ms`);
        
        const resDiv = document.createElement('div'); 
        resDiv.className = 'message bot'; 
        resDiv.innerText = `النتيجة من المحرك: [${rawOutput}]`;
        chatBox.appendChild(resDiv);
      } catch (err) {
        printLog(`Execution Error: ${err.message}`, "error");
      }
    };

    startLifecycle();
  </script>
</body>
</html>
