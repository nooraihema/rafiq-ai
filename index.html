<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رفيق AI | محرك أكاشا المتطور</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0c; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: #fff; }
    h1 { color: #00ff41; font-size: 24px; margin: 20px 0 0; text-shadow: 0 0 10px rgba(0,255,65,0.3); }
    .chat-container { width: 100%; max-width: 500px; height: 40vh; background: #111; border: 1px solid #222; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; margin-top: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
    .header { background: #000; color: #fff; padding: 12px; text-align: center; font-size: 13px; border-bottom: 1px solid #222; font-weight: bold; letter-spacing: 0.5px; }
    .status-dot { height: 8px; width: 8px; background-color: #555; border-radius: 50%; display: inline-block; margin-left: 5px; }
    .online { background-color: #00ff41; box-shadow: 0 0 8px #00ff41; }
    
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #141416; display: flex; flex-direction: column; }
    .message { padding: 10px 14px; border-radius: 12px; margin: 6px 0; font-size: 14px; max-width: 80%; line-height: 1.4; }
    .user { background: #0070f3; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot { background: #202024; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #333; font-weight: 500; }

    /* لوحة الـ Log الحديدية */
    .logs-container { width: 100%; max-width: 500px; height: 50vh; background: #020204; color: #00ff41; margin-top: 10px; border-radius: 8px; padding: 15px; font-family: 'Consolas', 'Monaco', 'Ubuntu Mono', monospace; font-size: 11px; overflow-y: auto; border: 1px solid #1f1f2e; box-shadow: inset 0 0 20px rgba(0,0,0,0.9); box-sizing: border-box;}
    .log-step { margin-bottom: 6px; border-left: 3px solid #00ff41; padding-left: 10px; line-height: 1.5; word-break: break-all; }
    
    /* ستايلات مخصصة لكل مستوى لسهولة الفحص بالعين */
    .log-step.fatal { border-left-color: #ff0055; color: #ff0055; background: rgba(255,0,85,0.05); font-weight: bold; }
    .log-step.error { border-left-color: #ff4d4d; color: #ff4d4d; background: rgba(255,77,77,0.03); }
    .log-step.warning { border-left-color: #ffb800; color: #ffb800; }
    .log-step.success { border-left-color: #00ff41; color: #00ff41; }
    .log-step.info { border-left-color: #00d2ff; color: #00d2ff; }
    .log-step.debug { border-left-color: #bd93f9; color: #bd93f9; }
    .log-step.trace { border-left-color: #ff79c6; color: #ff79c6; opacity: 0.85; }
    
    .log-tag { color: #f1c40f; font-weight: bold; margin-right: 4px; }
    .log-val { color: #50fa7b; }
    .log-stat-block { background: #09090e; border: 1px solid #1a1a24; padding: 6px; border-radius: 4px; margin: 4px 0; color: #ff79c6; display: block; font-size: 10.5px; white-space: pre-wrap; }
    .log-time { color: #6272a4; font-size: 9px; float: left; margin-top: 2px; }

    .input-container { display: flex; padding: 10px; background: #18181c; border-top: 1px solid #222; }
    input { flex: 1; border: 1px solid #333; background: #111; color: #fff; padding: 10px; outline: none; font-size: 14px; border-radius: 6px; }
    button { background: #00ff41; color: #000; font-weight: bold; border: none; padding: 0 20px; margin-left: 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #00cc33; box-shadow: 0 0 8px rgba(0,255,65,0.4); }
  </style>
</head>
<body>
  <h1>🔮 محرك أكاشا - نظام تشخيص عميق</h1>
  <div class="chat-container">
    <div class="header">
      رفيق AI - محرك أكاشا <span id="engine-status" class="status-dot"></span>
    </div>
    <div id="chat-box" class="chat-box"></div>
    <div class="input-container">
      <input type="text" id="user-input" placeholder="اكتب رسالتك لـ أكاشا..." autofocus />
      <button id="send-btn">إرسال</button>
    </div>
  </div>
  <div class="logs-container" id="logs-view"></div>

  <script type="module">
    import { AkashaEngine } from './src/core/akashaengine.js';
    import { AkashaRunner } from './src/core/akasharunner.js';
    import { Tokenizer } from './src/core/tokenizer.js';
    import { AkashaGenerator } from './src/core/generator.js';

    const logsView = document.getElementById('logs-view');
    const statusDot = document.getElementById('engine-status');
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    const LOG_LEVELS = {
      FATAL: 'fatal',
      ERROR: 'error',
      WARNING: 'warning',
      SUCCESS: 'success',
      INFO: 'info',
      DEBUG: 'debug',
      TRACE: 'trace'
    };

    let logCounter = 0;

    function getTimestamp() {
      const now = new Date();
      return now.toLocaleTimeString('ar-EG', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
    }

    // الـ Log الحديدي الجبار
    function printLog(tag, msg, level = LOG_LEVELS.INFO, details = null) {
      const timestamp = getTimestamp();
      logCounter++;

      const entry = document.createElement('div');
      entry.className = `log-step ${level}`;
      
      let detailsHtml = '';
      if (details) {
        if (typeof details === 'object') {
          detailsHtml = `<div class="log-stat-block">🧬 [التحليل الداخلي]:\n${JSON.stringify(details, null, 2)}</div>`;
        } else {
          detailsHtml = `<div class="log-stat-block">📊 ${details}</div>`;
        }
      }

      entry.innerHTML = `
        <span class="log-time">${timestamp}</span>
        <span class="log-tag">[#${logCounter} | ${tag}]</span> 
        <span>${msg}</span>
        ${detailsHtml}
      `;
      logsView.appendChild(entry);
      logsView.scrollTop = logsView.scrollHeight;
    }

    // فحص الأمعاء والمصفوفات العميقة (Deep Medical Scan for Tensors)
    function inspectArrayStructure(arrayOrTensor, name = 'Tensor') {
      if (!arrayOrTensor) {
        return { name, status: 'CRITICAL_NULL', error: 'المصفوفة غير موجودة في الذاكرة الحية' };
      }

      let rawData = arrayOrTensor.data !== undefined ? arrayOrTensor.data : arrayOrTensor;
      
      if (rawData && typeof rawData === 'object' && !ArrayBuffer.isView(rawData) && !Array.isArray(rawData)) {
        rawData = rawData.data || Object.values(rawData);
      }

      let shape = arrayOrTensor.shape || (rawData ? [rawData.length] : ['Unknown']);

      if (!rawData || !rawData.length || rawData.length === 0) {
        return { name, shape, size: 0, health: '0%', status: 'DEAD_EMPTY_BUFFER' };
      }

      let sum = 0;
      let squareSum = 0;
      let maxVal = -Infinity;
      let minVal = Infinity;
      let nonZeroCount = 0;
      let nanCount = 0;

      for (let i = 0; i < rawData.length; i++) {
        const v = rawData[i];
        if (isNaN(v) || v === undefined || v === null) {
          nanCount++;
          continue;
        }
        sum += v;
        squareSum += v * v;
        if (v > maxVal) maxVal = v;
        if (v < minVal) minVal = v;
        if (v !== 0) nonZeroCount++;
      }

      const totalValid = rawData.length - nanCount;
      const mean = totalValid > 0 ? sum / totalValid : 0;
      const variance = totalValid > 0 ? (squareSum / totalValid) - (mean * mean) : 0;
      const stdDev = Math.sqrt(Math.max(0, variance));
      const signalDensity = ((nonZeroCount / rawData.length) * 100).toFixed(2);

      let healthStatus = 'HEALTHY_SIGNAL';
      if (nanCount > 0) healthStatus = 'POISONED_NAN_DETECTED';
      else if (nonZeroCount === 0) healthStatus = 'BRAIN_DEAD_ALL_ZEROS';
      else if (parseFloat(signalDensity) < 15.0) healthStatus = 'FADING_SIGNAL_WARNING';

      const safeToFixed = (val, digits = 6) => {
        if (typeof val === 'number' && !isNaN(val) && isFinite(val)) {
          return val.toFixed(digits);
        }
        return "0.000000";
      };

      return {
        tensorId: arrayOrTensor.id || 'Anonymous_Node',
        shape: shape,
        totalElements: rawData.length,
        signalDensity: `${signalDensity}%`,
        mathematicalMetrics: {
          min: minVal === Infinity ? "0.000000" : safeToFixed(minVal),
          max: maxVal === -Infinity ? "0.000000" : safeToFixed(maxVal),
          mean: safeToFixed(mean),
          stdDev: safeToFixed(stdDev)
        },
        internalStatus: healthStatus,
        nanCount,
        sampleSlice: Array.from(rawData.slice(0, 6)).map(v => (typeof v === 'number' && !isNaN(v)) ? v.toFixed(5) : 'NaN')
      };
    }

    let engine, runner, generator;
    const tokenizer = new Tokenizer(5000);

    async function init() {
      printLog("CORE", "🚀 جاري تشغيل هندسة النظام الموحدة لمحرك أكاشا...", LOG_LEVELS.INFO);
      
      try {
        if (!navigator.gpu) {
          throw new Error("بيئة تشغيل WebGPU غير مدعومة بالمتصفح، تأكد من تفعيل الأعلام أو استخدام متصفح حديث.");
        }
        
        printLog("GPU", "📍 جاري فحص والتقاط الـ WebGPU Adapter الحصري...", LOG_LEVELS.TRACE);
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error("فشل التقاط Adapter. الـ GPU قد يكون مشغولاً أو غير مدعوم.");
        printLog("GPU", "✅ تم حجز الـ GPU Adapter بنجاح.", LOG_LEVELS.SUCCESS);

        const device = await adapter.requestDevice();
        printLog("GPU", "✅ تم إنشاء الـ GPUDevice وتخصيص قنوات التزامن.", LOG_LEVELS.SUCCESS);

        printLog("COMPILER", "📍 تهيئة الـ Akasha Engine الموحد (The Orchestrator)...", LOG_LEVELS.TRACE);
        engine = new AkashaEngine(device);
        
        printLog("RUNNER", "📍 جاري دمج الـ Akasha Runner بالـ Engine وتثبيت المعايير الحية...", LOG_LEVELS.TRACE);
        runner = new AkashaRunner(engine, 2526); 
        printLog("RUNNER", "✅ تم ربط الطبقات (Embedding, Attention, FFN) وتأمين الأوزان العشوائية.", LOG_LEVELS.SUCCESS);

        generator = new AkashaGenerator(runner);

        // 🛡️ [نظام حقن جواسيس التتبع الخارجي] 
        // بنحقرن وظائف فحص حية جوه الأكواد بمجرد إنشائها لمراقبة الـ Data Flow لحظياً
        injectDataFlowTracers();

        printLog("DATA", "📍 جاري سحب الـ dataset.txt وتجهيز مصفوفة الوعي الفلسفي...", LOG_LEVELS.TRACE);
        const res = await fetch('./dataset.txt');
        if (!res.ok) throw new Error(`فشل جلب ملف الداتا الحية المرجعية. كود: ${res.status}`);
        const text = await res.text();
        printLog("DATA", `✅ اتم تحميل الـ Dataset بسلام. الحجم الكلي: ${(text.length / 1024).toFixed(2)} KB`, LOG_LEVELS.SUCCESS);

        printLog("VOCAB", "📍 جاري فك ضغط الكلمات وبناء القاموس والرموز التوكنز الحرة...", LOG_LEVELS.TRACE);
        await generator.buildVocabFromText(text);
        
        statusDot.classList.add('online');
        printLog("READY", "🎯 تم الربط الهيكلي الكامل! المحرك شغال على سلكة موحدة ومستعد للاحتراق والتعلم.", LOG_LEVELS.SUCCESS);

      } catch (err) {
        statusDot.classList.remove('online');
        printLog("FATAL", `💥 قفلة قاتلة في تهيئة النظام: ${err.message}`, LOG_LEVELS.FATAL, { stack: err.stack });
      }
    }

    // 🕵️ دالة الجاسوسية وحقن الـ Tracers لرصد محطات الأمعاء الأربعة بدون لمس ملفاتها
    function injectDataFlowTracers() {
      if (!runner || !engine) return;

      // محطة 1 و 4: تتبع الـ Embedding والـ Const Propagation من خلال الـ Runner
      const originalForward = runner.forward || runner.execute;
      if (originalForward) {
        const wrappedForward = async function(...args) {
          printLog("TRACER_INPUT", "📥 محطة (1): الـ Runner استلم نبضة التوكنز وبدأ فحص المدخلات...", LOG_LEVELS.DEBUG, { inputArgs: args });
          
          // فحص حالة أوزان الـ Embedding والأوزان المخزنة (Const Propagation) قبل التنفيذ
          if (this.embeddingWeights || this.weights) {
            const embWeights = this.embeddingWeights || this.weights;
            printLog("TRACER_CONST", "💾 محطة (4): فحص انتشار الأوزان (Const Propagation) في الذاكرة الحية...", LOG_LEVELS.TRACE, inspectArrayStructure(embWeights, 'Embedding/Weights Array'));
          }

          const result = await originalForward.apply(this, args);

          printLog("TRACER_EMBED", "🎫 محطة (1): ناتج عملية الـ Embedding Lookup بعد الفحص...", LOG_LEVELS.TRACE, inspectArrayStructure(result, 'Embedding Output Tensor'));
          return result;
        };
        if (runner.forward) runner.forward = wrappedForward;
        else if (runner.execute) runner.execute = wrappedForward;
      }

      // محطة 2: تتبع ضرب المصفوفات ومدخلات الـ Attention
      if (runner.attention || runner.attnBlock) {
        const tgt = runner.attention || runner.attnBlock;
        const originalAttn = tgt.forward || tgt.execute;
        if (originalAttn) {
          const wrappedAttn = async function(...args) {
            printLog("TRACER_ATTN_IN", "🧠 محطة (2): دخول الخامات لطبقة الـ Attention (التحقق من Q, K, V)...", LOG_LEVELS.DEBUG);
            const attnResult = await originalAttn.apply(this, args);
            printLog("TRACER_ATTN_OUT", "💥 محطة (2): خروج الإشارة من الـ Attention.. هل ركبها الـ Softmax؟", LOG_LEVELS.TRACE, inspectArrayStructure(attnResult, 'Attention Out Vector'));
            return attnResult;
          };
          if (tgt.forward) tgt.forward = wrappedAttn;
          else if (tgt.execute) tgt.execute = wrappedAttn;
        }
      }

      // محطة 3: فحص الـ Plan Builder وحجز الـ Buffers جوه الـ Engine
      const originalSetBuffer = engine.setBuffer || engine.registerTensor || engine.writeBuffer;
      if (originalSetBuffer) {
        engine.setBuffer = function(tensorId, buffer, ...args) {
          printLog("TRACER_PLAN", `📋 محطة (3): الـ Plan Builder يحجز ويحور Tensor حقيقي في الـ GPU`, LOG_LEVELS.TRACE, {
            tensorId: tensorId,
            bufferSizeLength: buffer ? buffer.size : 'No Buffer Object'
          });
          return originalSetBuffer.apply(this, [tensorId, buffer, ...args]);
        };
      }
    }

    sendBtn.onclick = async () => {
      const text = userInput.value.trim();
      if (!text || !generator) {
        printLog("INPUT", "⚠️ مدخل فارغ أو الأمعاء البرمجية لم تكتمل تهيئتها بعد.", LOG_LEVELS.WARNING);
        return;
      }

      appendMessage('user', text);
      userInput.value = '';
      
      try {
        printLog("EXEC", `⚡ [بداية نبضة معالجة جديدة] 💥💥💥💥💥💥💥💥💥💥💥💥💥`, LOG_LEVELS.INFO);
        
        printLog("TOKENIZER", `📍 تشفير النص المدخل: "${text}"`, LOG_LEVELS.TRACE);
        const tokenIds = tokenizer.encode(text);
        printLog("TOKENIZER", `✅ عملية التوكنز تمت بنجاح. العدد: ${tokenIds.length} توكنز.`, LOG_LEVELS.SUCCESS, { IDs: tokenIds });

        printLog("PIPELINE", "🚀 إطلاق الـ Feed-Forward ومراقبة التنسورز العميقة في قاع المصفوفات...", LOG_LEVELS.DEBUG);
        
        const startTime = performance.now();
        const result = await generator.generate(tokenIds);
        const executionTime = (performance.now() - startTime).toFixed(2);

        printLog("GPU_PERF", `⏱️ تم تنفيذ الحسابات على الـ GPU الشامل في غضون: ${executionTime}ms`, LOG_LEVELS.SUCCESS);

        if (!result || !result.raw) {
          throw new Error("الـ Pipeline أكمل دورتة لكن المخرج النهائي رجع Null أو غير معرف!");
        }

        printLog("DIAGNOSTIC", "🔮 جاري عمل فحص أشعة تشخيصية (X-Ray) لمصفوفة المخرجات الناتجة...", LOG_LEVELS.DEBUG);
        const internalInspection = inspectArrayStructure(result.raw, 'Final Logits Output');
        
        if (internalInspection.internalStatus === 'BRAIN_DEAD_ALL_ZEROS') {
          printLog("CRITICAL", "🚨 كارثة الأمعاء: إشارة ميتة تماماً (All Zeros)! الـ GPU رجع بفرز تالف أو لم يتم نقل البيانات بالـ mapAsync صح.", LOG_LEVELS.FATAL, internalInspection);
        } else if (internalInspection.internalStatus === 'POISONED_NAN_DETECTED') {
          printLog("CRITICAL", "🚨 انفجار رياضي: تم رصد قيم NaN! الـ Learning rate أو الـ Positional initialization طار في الهوا وعمل Overflow.", LOG_LEVELS.FATAL, internalInspection);
        } else if (internalInspection.internalStatus === 'FADING_SIGNAL_WARNING') {
          printLog("WARNING", "⚠️ تحذير طبي: الإشارة خاملة وباهتة جداً (توزيع متدني). راجع دالة الـ Attention scaling.", LOG_LEVELS.WARNING, internalInspection);
        } else {
          printLog("SIGNAL_HEALTH", "✅ إشارة حية وصحية ممتازة واخترقت المصفوفات بنجاح!", LOG_LEVELS.SUCCESS, internalInspection);
        }

        printLog("RESULT", `🎯 الكلمة المرجحة من الذكاء الاصطناعي: "${result.word}"`, LOG_LEVELS.SUCCESS, {
          confidenceScore: result.confidence,
          predictedIndex: result.index
        });

        printLog("EXEC", `⚡ [نهاية النبضة - الإشارة مستقرة] ═════════════════════════`, LOG_LEVELS.INFO);
        appendMessage('bot', result.word);

      } catch (err) {
        printLog("EXEC_ERROR", `💥 انهيار الإشارة أثناء المعالجة: ${err.message}`, LOG_LEVELS.ERROR, {
          errorType: err.constructor.name,
          errorTrace: err.stack?.split('\n').slice(0, 4).join('\n')
        });
      }
    };

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

    printLog("STARTUP", "🎬 جاري فحص البنية الأساسية للمتصفح واستدعاء الأجهزة الحيوية...", LOG_LEVELS.INFO);
    init();
  </script>
</body>
</html>
